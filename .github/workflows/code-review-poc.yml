name: Automated Code Review POC

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write # Required for Reviewdog and PR-Agent to comment on PRs
  checks: write

