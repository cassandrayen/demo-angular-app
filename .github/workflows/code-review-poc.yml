  # Job 2: Open-Source AI Code Reviewer (PR-Agent)
  pr-agent-ai-review:
    name: PR-Agent AI Review
    runs-on: ubuntu-latest
    # needs: linter-inline-review
    if: ${{ github.event.sender.type != 'Bot' }}
    steps:
      - name: Run PR-Agent Review
        uses: the-pr-agent/pr-agent@main # <--- Fixes 'repository not found'
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}