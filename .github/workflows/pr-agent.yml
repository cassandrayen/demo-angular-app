name: AI PR Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write 
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        # continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG.MODEL: "gemini/gemini-3.6-flash"
          CONFIG.FALLBACK_MODELS: '["gemini/gemini-3.6-flash"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          # Add this line to force reviews on new commits!
          github_action_config.handle_push_trigger: "true"
          # Tell the AI to completely ignore all YAML files
          IGNORE.GLOB: '["**/*.yml", "**/*.yaml"]'
          # Force the AI to output a specific trigger word!
          pr_reviewer.extra_instructions: 'If you detect ANY type mismatches, logic bugs, or invalid TypeScript, you MUST include the exact text "[CRITICAL_AI_FAILURE]" in your response.'

      - name: Evaluate AI Feedback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
        run: |
          echo "Fetching the latest PR Reviewer Guide comment..."
          LATEST_GUIDE_COMMENT=$(gh pr view $PR_URL --json comments --jq '.comments | map(select(.author.login | startswith("github-actions"))) | map(select(.body | contains("PR Reviewer Guide"))) | last | .body')
          
          echo "Scanning for our secret failure keyword..."
          
          # We are now searching for the exact keyword we forced the AI to use
          if echo "$LATEST_GUIDE_COMMENT" | grep -Fq "[CRITICAL_AI_FAILURE]"; then
            echo "❌ ERROR: AI flagged a critical code issue! Blocking merge."
            exit 1
          else
            echo "✅ SUCCESS: AI approved the code."
            exit 0
          fi

  lint_code_job:
    name: ESLint & Code Quality
    # We only want this to run on code pushes, not when someone types /review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Linting
        run: npm run lint