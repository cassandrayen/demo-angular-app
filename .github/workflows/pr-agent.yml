name: AI PR Reviewer

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
      checks: write 
    name: Run PR Agent
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG.MODEL: "gemini/gemini-3.6-flash"
          CONFIG.FALLBACK_MODELS: '["gemini/gemini-3.6-flash"]'

      - name: Evaluate AI Feedback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Fetching PR comments..."
          # Fetch the body of the most recent comment made by the github-actions bot
          LATEST_COMMENT=$(gh pr view $PR_URL --json comments --jq '.comments | map(select(.author.login == "github-actions")) | last | .body')
          
          echo "Scanning AI comment for compilation errors..."
          
          # Search for specific phrases the AI uses when the code is broken
          if echo "$LATEST_COMMENT" | grep -qiE "compilation error|prevents the application from building|TS[0-9]{4}"; then
            echo "❌ ERROR: The AI detected a TypeScript compilation error! Blocking merge."
            exit 1
          else
            echo "✅ SUCCESS: No compilation errors mentioned in the AI review."
            exit 0
          fi

  lint_code_job:
    name: ESLint & Code Quality
    # We only want this to run on code pushes, not when someone types /review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Linting
        run: npm run lint